name: Build and Deploy Next.js to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create .env file from secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir deploy
          cp -r .next public package.json package-lock.json .env deploy/
          cd deploy && tar -czf ../deploy_hr.tar.gz . && cd ..

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add Droplet to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to DigitalOcean Droplet
        run: |
          scp deploy_hr.tar.gz ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/tmp/deploy_hr.tar.gz

      - name: Deploy on Droplet
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
            tar -xzf /tmp/deploy_hr.tar.gz -C /home/nikit/project/hrms_hr_portal
            cd /home/nikit/project/hrms_hr_portal
            npm install
            pm2 restart hrms-hr
          EOF
