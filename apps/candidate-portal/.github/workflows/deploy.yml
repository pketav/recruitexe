name: Build and Deploy to Server

on:
  push:
    branches:
      - main              # ← change if your deploy branch is different

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣  Check out code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣  Set up Node (match your local version)
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'   # or 20 if you prefer
        cache: 'npm'

    # 3️⃣  Install dependencies and build
    - name: Install dependencies
      run: npm i --legacy-peer-deps
    - name: Build Next.js app
      run: npm run build

    # 4️⃣  Copy build artifacts & essential files to server
    - name: Upload build to server via SCP
      uses: appleboy/scp-action@v0.1.3
      with:
        host:    ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key:     ${{ secrets.SERVER_KEY }}    # your private SSH key
        # Comma-separated list of items to copy
        source: ".next,public,package.json,package-lock.json,.env"
        target: "/home/nikit/project/hrms_candidate_prod"  # destination dir

    # 5️⃣  SSH in and finish deployment (install deps, reload PM2)
    - name: Deploy & restart app via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host:     ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SERVER_KEY }}
        script: |
          set -e
          echo "➜ Switching to project directory"
          cd /home/nikit/project/hrms_candidate_prod

          echo "➜ Installing production dependencies"
          npm i --legacy-peer-deps

          echo "➜ Restarting (or starting) PM2 process: candidate"
          pm2 reload candidate --update-env

          echo "➜ Saving PM2 process list"
          pm2 save
